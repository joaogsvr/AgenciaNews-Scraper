services:
  # Serviço do banco de dados (PostgreSQL)
  db:
    image: postgres:15 
    container_name: bmj_project_db
    environment:
      - POSTGRES_USER=joaog
      - POSTGRES_PASSWORD=bmj1212
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 

# Volumes para garantir a persistência dos dados
volumes:
  postgres_data: